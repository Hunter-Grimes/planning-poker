<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <title>Planning Poker</title>
    <script>
      // Apply theme before paint to avoid flash.
      (function () {
        try {
          var saved = localStorage.getItem('pp_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Placeholder shown until React mounts. The app gates its first render on
         fetching ICE servers (up to a few seconds on a slow network), so this
         avoids a blank white screen during that wait. React replaces it. -->
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          font-family:
            ui-sans-serif,
            system-ui,
            -apple-system,
            Segoe UI,
            Roboto,
            sans-serif;
          color: #6b7280;
        "
      >
        <p style="font-size: 0.875rem">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
